spring.config.import=optional:file:.env[.properties]
spring.application.name=backend
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=86400000
logging.level.org.springframework.security=DEBUG

spring.datasource.hikari.isolate-internal-queries=true
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.max-life-time=600000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.leak-detection-threshold=120000
spring.datasource.hikari.validation-timeout=30000
spring.jpa.open-in-view=false

app.storage.root=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.ocr.tessdata-path=/usr/share/tesseract-ocr/5/tessdata

# Gemini AI (Google AI Studio) for Khmer OCR text correction
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent
gemini.api.timeout-ms=30000
